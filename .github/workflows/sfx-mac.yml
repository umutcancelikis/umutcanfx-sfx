name: SFX engine (Mac)
on:
  push:
    branches: [sfx-mac-build]
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Source (openmoss v0.3.0, Apache-2.0)
        run: |
          git clone --depth 1 --branch v0.3.0 --recurse-submodules --shallow-submodules https://github.com/pwilkin/openmoss src
          git -C src rev-parse HEAD
          git -C src/third_party/llama.cpp rev-parse HEAD
      - name: UmutcanFX patches (window_seconds, Metal transposed conv, Metal 4 language)
        run: |
          python3 - <<'PYEOF'
          import io, sys
          def rep(p, a, b, n=1):
              s = io.open(p, encoding='utf-8', newline='').read()
              c = s.count(a)
              if c != n:
                  sys.exit('PATCH FAIL %s: %d x %r' % (p, c, a[:70]))
              io.open(p, 'w', encoding='utf-8', newline='').write(s.replace(a, b))
              print('patched', p)

          # 1) optional shorter latent window for /sfx ("window_seconds", 0 = full length as upstream)
          rep('src/include/openmoss/soundeffect.h', '    float seconds = 10.0f;\n',
              '    float seconds = 10.0f;\n\n'
              '    // UmutcanFX: optional shorter latent window in seconds (0 = full max_seconds, the upstream behaviour)\n'
              '    float window_seconds = 0.0f;\n')
          rep('src/src/soundeffect.cpp',
              '    const int64_t n_latents = int64_t(d.sampling_rate) * int64_t(d.max_seconds) / d.vae_hop;\n',
              '    int64_t n_latents = int64_t(d.sampling_rate) * int64_t(d.max_seconds) / d.vae_hop;\n'
              '    // UmutcanFX: optional shorter latent window (never shorter than the requested duration)\n'
              '    if (req.window_seconds > 0.0f && req.initial_latent.empty()) {\n'
              '        int64_t w = int64_t(std::ceil(double(req.window_seconds) * double(d.sampling_rate) / double(d.vae_hop)));\n'
              '        const int64_t need = int64_t(std::ceil(double(seconds) * double(d.sampling_rate) / double(d.vae_hop)));\n'
              '        if (w < need) w = need;\n'
              '        if (w < 8) w = 8;\n'
              '        if (w < n_latents) n_latents = w;\n'
              '    }\n')
          rep('src/src/server/moss_tts_server.cpp',
              '        req.seconds             = jget(body, "seconds",             req.seconds);\n',
              '        req.seconds             = jget(body, "seconds",             req.seconds);\n'
              '        req.window_seconds      = jget(body, "window_seconds",      req.window_seconds);\n')

          # 2) Metal transposed conv: one SIMD group (32 threads) per output instead of one thread (audio decode)
          M = 'src/third_party/llama.cpp/ggml/src/ggml-metal/ggml-metal.metal'
          rep(M, '''typedef void (conv_transpose_1d_t)(
                  constant ggml_metal_kargs_conv_transpose_1d & args,
                  device const float * src0,
                  device const float * src1,
                  device        char * dst,
                  uint3   tgpig[[threadgroup_position_in_grid]],
                  uint3    tgpg[[threadgroups_per_grid]]);''', '''typedef void (conv_transpose_1d_t)(
                  constant ggml_metal_kargs_conv_transpose_1d & args,
                  device const float * src0,
                  device const float * src1,
                  device        char * dst,
                  uint3   tgpig[[threadgroup_position_in_grid]],
                  uint3    tgpg[[threadgroups_per_grid]],
                  ushort  tiitg[[thread_index_in_threadgroup]],
                  ushort3   ntg[[threads_per_threadgroup]]);''')
          rep(M, '''        device        char * dst,
                  uint3   tgpig[[threadgroup_position_in_grid]],
                  uint3   tgpg[[threadgroups_per_grid]]) {

              // For output position j on the time axis, only input positions''', '''        device        char * dst,
                  uint3   tgpig[[threadgroup_position_in_grid]],
                  uint3   tgpg[[threadgroups_per_grid]],
                  ushort  tiitg[[thread_index_in_threadgroup]],
                  ushort3   ntg[[threads_per_threadgroup]]) {

              // For output position j on the time axis, only input positions''')
          rep(M, '''        for (int64_t c = 0; c < args.IC; c++) {
                      const int32_t kernel_offset = c * tgpg[1] * K + K * tgpig[1];
                      const int32_t input_offset  = c * IL;

                      for (int32_t i = i_min; i <= i_max; i++) {
                          v += float(src0[kernel_offset + j - i * s0]) * src1[input_offset + i];
                      }
                  }
              }

              device float * dst_ptr = (device float *) (dst + tgpig[0] * args.nb0 + tgpig[1] * args.nb1);

              dst_ptr[0] = v;
          }''', '''        for (int64_t c = tiitg; c < args.IC; c += ntg.x) {
                      const int32_t kernel_offset = c * tgpg[1] * K + K * tgpig[1];
                      const int32_t input_offset  = c * IL;

                      for (int32_t i = i_min; i <= i_max; i++) {
                          v += float(src0[kernel_offset + j - i * s0]) * src1[input_offset + i];
                      }
                  }
              }

              v = simd_sum(v);

              if (tiitg == 0) {
                  device float * dst_ptr = (device float *) (dst + tgpig[0] * args.nb0 + tgpig[1] * args.nb1);
                  dst_ptr[0] = v;
              }
          }''')
          for T in ('float', 'half '):
              rep(M, '''    device const %s * src0,
              device const float * src1,
              device        char * dst,
              uint3   tgpig[[threadgroup_position_in_grid]],
              uint3    tgpg[[threadgroups_per_grid]]);''' % T, '''    device const %s * src0,
              device const float * src1,
              device        char * dst,
              uint3   tgpig[[threadgroup_position_in_grid]],
              uint3    tgpg[[threadgroups_per_grid]],
              ushort  tiitg[[thread_index_in_threadgroup]],
              ushort3   ntg[[threads_per_threadgroup]]);''' % T)
          rep('src/third_party/llama.cpp/ggml/src/ggml-metal/ggml-metal-ops.cpp',
              'ggml_metal_encoder_dispatch_threadgroups(enc, OL, OC, 1, 1, 1, 1);',
              'ggml_metal_encoder_dispatch_threadgroups(enc, OL, OC, 1, 32, 1, 1);')

          # 3) Metal language 4 on macOS 26 (M5 tensor API)
          rep('src/third_party/llama.cpp/ggml/src/ggml-metal/ggml-metal-device.m',
              'options.preprocessorMacros = prep;',
              'options.preprocessorMacros = prep;\n        if (@available(macOS 26.0, *)) { options.languageVersion = MTLLanguageVersion4_0; }', n=2)
          print('ALL PATCHES OK')
          PYEOF
      - name: Xcode 26 (M5 tensor API)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      - name: Build (Metal, arm64)
        run: |
          cmake -S src -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DGGML_NATIVE=OFF -DBUILD_SHARED_LIBS=OFF
          cmake --build build --config Release -j 3 --target moss-tts-server
      - name: Test
        run: |
          B=$(find build -type f -name moss-tts-server | head -1); echo "BIN=$B" >> "$GITHUB_ENV"
          "$B" --help
          otool -L "$B"
          ("$B" --model /tmp/none.gguf --port 18080 --no-webui 2>&1 || true) | head -40
      - name: Package
        run: |
          mkdir -p pkg/bin pkg/licenses
          cp "$BIN" pkg/bin/moss-tts-server && codesign --force -s - pkg/bin/moss-tts-server
          cp src/LICENSE pkg/licenses/openmoss-LICENSE.txt
          printf 'This build was modified by UmutcanFX: (1) optional /sfx request field window_seconds (shorter latent window; 0 = upstream full length), (2) Metal conv_transpose_1d uses one SIMD group per output, (3) Metal language version 4 on macOS 26.\n' > pkg/licenses/UmutcanFX-CHANGES.txt
          cp src/third_party/llama.cpp/LICENSE pkg/licenses/llama.cpp-LICENSE.txt
          find src/third_party -maxdepth 2 -type f \( -iname 'LICENSE*' -o -iname 'COPYING*' -o -iname 'NOTICE*' \) -not -path '*/llama.cpp/*' | while read f; do cp "$f" "pkg/licenses/$(basename "$(dirname "$f")")-$(basename "$f").txt"; done
          for h in $(find src/third_party -maxdepth 3 -type f \( -name 'httplib.h' -o -name 'json.hpp' \)); do head -n 40 "$h" > "pkg/licenses/$(basename "$h")-license-header.txt"; done
          (cd pkg && zip -qry ../ufx-sfx-engine-macos-arm64.zip .)
          ls -l ufx-sfx-engine-macos-arm64.zip && shasum -a 256 ufx-sfx-engine-macos-arm64.zip && unzip -l ufx-sfx-engine-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ufx-sfx-engine-macos-arm64
          path: ufx-sfx-engine-macos-arm64.zip
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create sfx-engine-mac-3 ufx-sfx-engine-macos-arm64.zip --repo "$GITHUB_REPOSITORY" --target main --latest=false \
            --title "UmutcanFX SFX engine (Mac) 3" --notes "Mac (M1 and later) engine for Sound Lab - Text to Sound Effect. License files are inside the zip."
